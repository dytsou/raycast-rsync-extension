name: Publish to npmjs & GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      # npm-only repo: skip pnpm install/pack; publish with already-installed node_modules.
      - name: Publish to npmjs
        id: npmjs
        uses: dytsou/release/npm-publish@98055479dc1f0015d278ecd26b54ec6897d85eed # v1.3.5 (@v1)
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          install-deps: "false"
          verify-pack: "false"
          node-version: "22"

      # GitHub Packages requires a scoped name; temporarily rewrite package.json.
      - name: Scope package name for GitHub Packages
        run: |
          set -euo pipefail
          cp package.json package.json.backup
          jq --arg owner "${{ github.repository_owner }}" --arg name "$(node -p "require('./package.json').name")" \
            '.name = ("@" + $owner + "/" + $name)' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Publish to GitHub Packages
        id: ghpkg
        uses: dytsou/release/github-packages@98055479dc1f0015d278ecd26b54ec6897d85eed # v1.3.5 (@v1)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: "false"
          verify-pack: "false"
          node-version: "22"

      - name: Restore package.json
        if: always()
        run: |
          if [ -f package.json.backup ]; then
            mv package.json.backup package.json
          fi

      - name: GitHub Release
        if:
          steps.npmjs.outputs.published == 'true' ||
          steps.ghpkg.outputs.published == 'true'
        uses: dytsou/release/github@98055479dc1f0015d278ecd26b54ec6897d85eed # v1.3.5 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
          body: |
            ## ${{ steps.npmjs.outputs.name }}@${{ steps.npmjs.outputs.version }}

            **Published to multiple registries:**

            - **npmjs.com**: https://www.npmjs.com/package/${{ steps.npmjs.outputs.name }}

            - **GitHub Packages**: https://github.com/${{ github.repository }}/packages

            *Note: If a registry already had this version, it was skipped. Only missing registries were published.*

            ### Installation

            **From npmjs (recommended):**

            ```bash
            npm install ${{ steps.npmjs.outputs.name }}
            ```

            **From GitHub Packages:**

            ```bash
            npm install @${{ github.repository_owner }}/${{ steps.npmjs.outputs.name }} --registry=https://npm.pkg.github.com
            ```

            Or add to your `.npmrc`:

            ```ini
            @${{ github.repository_owner }}:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=YOUR_GITHUB_TOKEN
            ```

            Then install:

            ```bash
            npm install @${{ github.repository_owner }}/${{ steps.npmjs.outputs.name }}
            ```

      - name: Publish summary
        if: always()
        run: |
          echo "## Publish Summary"
          echo "### npmjs"
          if [ "${{ steps.npmjs.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.npmjs.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
          echo ""
          echo "### GitHub Packages"
          if [ "${{ steps.ghpkg.outputs.skipped }}" == "true" ]; then
            echo "Skipped - version already exists"
          elif [ "${{ steps.ghpkg.outputs.published }}" == "true" ]; then
            echo "Published successfully"
          else
            echo "Not published"
          fi
